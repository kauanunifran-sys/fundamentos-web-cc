<!DOCTYPE htm
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exemplo formulário HTML</title>
</head>
<body>
    <hearder>
        <h3>formulário e Inputs</h3>
    </hearder>
    <main>

        <form id="regiterForm" method="POST">
        <label for="nome"> Nome Completo: </label>
        <input type="text" id="nome" name="nome" required />
        <br>
        <br>
        <label>Endereço de e-mail: </label>
        <input type="email" id="email" name="email"/>
        <br>
        <br>    
        <label for="senha">Informe sua senha: </label>
        <input type="password" id="senha" name="senha" required minlength="8"
            title="A senha deve ter no mínimo 8 caracteres">    
        <br>
        <br>
        <label for="mensagem">Informe sua mensagem: </label>
        <br>    
        <textarea name="mensagem" id="mensagem" cols="30" rows="10"></textarea>
        <br>
        <br>
        <label for="evento">Selecione o evento escolhido: </label>
        <!-- tag de seletor, ao selecionar uma das opções o valeu da option é atribuito ao name do select -->
        <!-- key:valeu -->
        <!-- evento:teatro -->
        <select id="evento" name="evento">
            <option value="rock">Show de rock</option>
            <option value="modao">Show de Sertanejo</option>
            <option value="teatro">Teatro</option>
        </select>
        <br>
        <br>
        <!-- input checkobox -> opção de multipla escolha -->
        <label for="termos">
            <input type="checkbox" id="termos" name="termos" required/>
            Aceito os termos de uso
        </label>
        <br>
        <br>
        <!-- Input type radio -> Escolha única -->
        <label><input type="radio" name="pagamento" value="pix"/>pix</label>
        <label><input type="radio" name="pagamento" value="cartão"/>Cartão</label>
        <br>
        <input type="date">
        <br>
        <input type="file">
        <input type="text" id="cpf" name="cpf" placeholder="000.000.000-00" required pattern="\d{3}\.\d{3}\.\d{3}-\d{2}" Title="formato esperado: 000.000.000-00"/>
        <!-- para o type radio funcionar ambos os inputs devem compartilhar o mesmo name -->
        <br>
        <br> 
        <input type="submit" valeu="cadastrar"/>
        <button type="button" onclick="">canelar</button>
        <br>
        <br>
        </form>
    </main>
    <footer>
        <p>Desenvolvido por Kauan</p>
    </footer>

    <script>
        document.getElementById('regiterForm').
        addEventListener('submit', function (event)
        {
            event.preventDefault(); // impede o comportamento padrão de envio do formulário (recarregamento)
            const nome = document.getElementById('nome').valeu;
            alert('Olá, '+ nome+' cadastro enviado com sucesso');
        })
    </script>

</body>
</html>
